# ---------------------------------------------------------------------------
# Arbitrage Selling Scout - zentrale Konfiguration
# Alle Werte sind ueber Umgebungsvariablen ueberschreibbar (Praefix: SCOUT__),
# z. B. SCOUT__MARGIN__MIN_ROI_PERCENT=30
# Geheimnisse gehoeren NICHT hierher, sondern in .env
# ---------------------------------------------------------------------------

# --- Schwellenwerte fuer die Kaufempfehlung -------------------------------
margin:
  min_roi_percent: 25.0            # Mindest-ROI auf das eingesetzte Kapital
  min_profit_eur: 12.0             # Mindest-Reingewinn je Einheit

# --- Kostenpauschalen (Verkaeuferseite = eBay) ----------------------------
costs:
  shipping_cost_domestic_eur: 5.49 # Inlandsversand DHL Paket o. ae.
  packaging_cost_eur: 1.20         # Karton, Fuellmaterial, Etikett
  ebay_fee_percent: 12.0           # Verkaufsprovision auf den Bruttopreis
  ebay_fixed_fee_eur: 0.35         # Fixe Transaktionsgebuehr je Verkauf
  return_buffer_percent: 4.0       # Risikopuffer fuer Retouren/Ausfaelle
  payment_fee_percent: 0.0         # Optional, falls separat abgerechnet

  # Beschaffungsseitige Zusatzkosten (Standard: aus, damit die Basisformel gilt)
  import_duty_percent: 0.0         # Zoll auf den Einkaufswert (z. B. AliExpress)
  inbound_shipping_eur: 0.0        # Versand Lieferant -> Lager, falls nicht im Preis

# --- Steuern ---------------------------------------------------------------
tax:
  # false = Kleinunternehmer (§19 UStG): USt wird ignoriert, Bruttorechnung.
  # true  = Regelbesteuerung: USt wird vom Verkaufspreis abgezogen und die
  #         Vorsteuer aus dem Einkauf gegengerechnet.
  vat_registered: false
  vat_rate_percent: 19.0
  # Vorsteuerabzug auf den Einkauf nur, wenn eine EU-Rechnung vorliegt.
  input_vat_deductible: false

# --- LLM-Matching -----------------------------------------------------------
llm:
  # Welches Backend den semantischen Produktabgleich uebernimmt.
  #   gemini -- Google Gemini, echte Structured Outputs, grosszuegiges Kontingent
  #   groq   -- Groq, deutlich schneller und guenstiger, dafuer je nach Modell
  #             nur JSON-Modus statt erzwungenem Schema
  provider: "gemini"
  # Ab dieser Sicherheit gilt ein Match als belastbar. Gilt fuer beide Backends.
  min_confidence: 0.80

gemini:
  # Google zieht Modellversionen regelmaessig fuer Neukunden zurueck (2.5-flash
  # antwortet inzwischen mit HTTP 404, nicht mit einem retry-faehigen Fehler).
  # Aktuellen Stand pruefen: https://ai.google.dev/gemini-api/docs/models
  model: "gemini-3.8-flash"
  temperature: 0.0                 # Deterministisch fuer reproduzierbare Matches
  max_output_tokens: 1024
  timeout_seconds: 30
  max_retries: 4                   # Exponentielles Backoff bei 429/5xx
  initial_backoff_seconds: 2.0
  max_backoff_seconds: 60.0
  requests_per_minute: 60
  thinking_budget: 0               # 0 = aus (schneller/guenstiger bei 2.5-flash)

groq:
  # Groq wechselt sein Modellangebot haeufiger als Google. Vor dem ersten Lauf
  # gegen die aktuelle Liste pruefen: https://console.groq.com/docs/models
  model: "llama-3.3-70b-versatile"
  temperature: 0.0
  max_output_tokens: 1024
  timeout_seconds: 30
  max_retries: 4
  initial_backoff_seconds: 2.0
  max_backoff_seconds: 60.0
  # Bewusst niedriger als bei Gemini: der kostenlose Groq-Tarif bremst frueh.
  requests_per_minute: 30
  # true erzwingt das Schema serverseitig, koennen aber nicht alle Modelle.
  # Lehnt das Modell ab, faellt der Provider automatisch auf den JSON-Modus
  # zurueck -- der Lauf geht also in keinem Fall verloren.
  json_schema_mode: false

# --- Datenquellen ----------------------------------------------------------
sources:
  #   csv  -- fertige Paare (Einkauf + Verkauf) aus data/offers.csv, manuell gepflegt
  #   mock -- eingebaute Testfaelle, keine echten Angebote
  #   api  -- automatisch: Einkaufsangebote (Liste oder Amazon) -> passende eBay-Angebote
  provider: "csv"
  csv:
    offers_path: "data/offers.csv"
  api:
    # Einkaufsseite:
    #   csv    -- Einkaufsliste data/purchases.csv (Amazon, AliExpress, beliebig;
    #             Vorlage: python scout.py --write-example-data)
    #   amazon -- Amazon Creators API. Nur mit freigeschaltetem Associates-Account
    #             und >=10 qualifizierten Verkaeufen in 30 Tagen.
    purchase_source: "csv"
    purchase_csv_path: "data/purchases.csv"
    amazon_country: "DE"
    amazon_results_per_keyword: 10   # Maximum der Creators API
    # Verkaufsseite ist immer eBay (Browse API, nur aktive Angebote -- keine
    # tatsaechlich erzielten Verkaufspreise).
    ebay_marketplace: "EBAY_DE"
    ebay_results_per_offer: 5        # Kandidaten je Einkaufsangebot (je einer = ggf. 1 LLM-Aufruf)
    ebay_new_only: true
    ebay_sort: "best_match"          # best_match | price
  http:
    timeout_seconds: 20
    max_retries: 3
    user_agent: "ArbitrageScout/1.0 (+headless)"

# --- Suchraum --------------------------------------------------------------
search:
  max_candidates_per_run: 200      # Harte Obergrenze je Lauf (Kostenkontrolle)
  # Strenge des kostenlosen Vorfilters vor dem LLM-Aufruf.
  # 0.0 = nur sichere Verlustgeschaefte verwerfen, 1.0 = volle Schwellen anlegen.
  prefilter_margin_factor: 0.5
  categories:
    - name: "haushalt"
      keywords:
        - "Wasserfilter Kartusche"
        - "Vakuumierer Folienrollen"
      max_purchase_price_eur: 60.0
    - name: "kfz"
      keywords:
        - "OBD2 Diagnosegeraet"
        - "Scheibenwischer Set"
      max_purchase_price_eur: 80.0
    - name: "elektronik-zubehoer"
      keywords:
        - "USB-C Hub 8 in 1"
        - "Powerbank 20000mAh"
      max_purchase_price_eur: 100.0

# --- Ausgabe ---------------------------------------------------------------
output:
  results_dir: "data"
  write_csv: true
  write_json: true
  # Nur Treffer mit Kaufempfehlung exportieren
  only_recommended: false

# --- Logging ---------------------------------------------------------------
logging:
  level: "INFO"                    # DEBUG | INFO | WARNING | ERROR
  dir: "logs"
  filename: "scout.log"
  max_bytes: 5242880               # 5 MB je Datei
  backup_count: 5
  console: true
  json_format: false               # true = strukturierte Logs fuer Loki/ELK

# --- Telegram (optional) -----------------------------------------------------
# Zugangsdaten (TELEGRAM_BOT_TOKEN, TELEGRAM_CHAT_ID) stehen in .env, nicht hier.
telegram:
  long_poll_seconds: 20.0          # Long-Poll-Timeout gegen getUpdates (listener.py)
  notify_on_empty: true            # Auch senden, wenn 0 Empfehlungen (Herzschlag)
  max_recommendations_in_message: 10
